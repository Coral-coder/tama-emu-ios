<circle cx="660" cy="390" r="10" fill="#c8a25a"/>
<text x="676" y="395" fill="#0b0f12" font-size="11" text-anchor="start" font-weight="700"></text>
<text x="682" y="395" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="start">6  IO13 · SD select</text>
<circle cx="340" cy="434" r="10" fill="#c8a25a"/>
<text x="324" y="439" fill="#0b0f12" font-size="11" text-anchor="end" font-weight="700"></text>
<text x="318" y="439" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="end">IO32 · LoRa  7</text>

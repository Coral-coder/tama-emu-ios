<text x="676" y="307" fill="#0b0f12" font-size="11" text-anchor="start" font-weight="700"></text>
<text x="682" y="307" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="start">4  IO2 · SD</text>
<circle cx="340" cy="346" r="10" fill="#c8a25a"/>
<text x="324" y="351" fill="#0b0f12" font-size="11" text-anchor="end" font-weight="700"></text>
<text x="318" y="351" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="end">IO26 · LoRa  5</text>
<circle cx="660" cy="346" r="10" fill="#c8a25a"/>
<text x="676" y="351" fill="#0b0f12" font-size="11" text-anchor="start" font-weight="700"></text>
<text x="682" y="351" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="start">5  IO15 · SD</text>

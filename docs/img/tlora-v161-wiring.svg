<text x="324" y="263" fill="#0b0f12" font-size="11" text-anchor="end" font-weight="700"></text>
<text x="318" y="263" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="end">3V3  3</text>
<circle cx="660" cy="258" r="10" fill="#c8a25a"/>
<text x="676" y="263" fill="#0b0f12" font-size="11" text-anchor="start" font-weight="700"></text>
<text x="682" y="263" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="start">3  IO0 · boot</text>
<circle cx="340" cy="302" r="10" fill="#c8a25a"/>
<text x="324" y="307" fill="#0b0f12" font-size="11" text-anchor="end" font-weight="700"></text>
<text x="318" y="307" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="end">GND  4</text>

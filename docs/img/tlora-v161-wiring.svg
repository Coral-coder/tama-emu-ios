<text x="324" y="615" fill="#0b0f12" font-size="11" text-anchor="end" font-weight="700"></text>
<text x="318" y="615" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="end">RXD · USB  11</text>
<circle cx="660" cy="610" r="10" fill="#c8a25a"/>
<text x="676" y="615" fill="#0b0f12" font-size="11" text-anchor="start" font-weight="700"></text>
<text x="682" y="615" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="start">11  EN · reset</text>
<circle cx="340" cy="654" r="10" fill="#c8a25a"/>
<text x="324" y="659" fill="#0b0f12" font-size="11" text-anchor="end" font-weight="700"></text>
<text x="318" y="659" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="end">TXD · USB  12</text>
<circle cx="660" cy="654" r="10" fill="#c8a25a"/>
<text x="676" y="659" fill="#0b0f12" font-size="11" text-anchor="start" font-weight="700"></text>
<text x="682" y="659" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="start">12  IO39</text>

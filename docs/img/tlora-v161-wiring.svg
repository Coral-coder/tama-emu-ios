<text x="676" y="439" fill="#0b0f12" font-size="11" text-anchor="start" font-weight="700"></text>
<text x="682" y="439" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="start">7  IO12 · SD, boot</text>
<circle cx="340" cy="478" r="10" fill="#c8a25a"/>
<text x="324" y="483" fill="#0b0f12" font-size="11" text-anchor="end" font-weight="700"></text>
<text x="318" y="483" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="end">IO19 · LoRa  8</text>
<circle cx="660" cy="478" r="10" fill="#c8a25a"/>
<text x="676" y="483" fill="#0b0f12" font-size="11" text-anchor="start" font-weight="700"></text>
<text x="682" y="483" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="start">8  IO14 · SD</text>
<circle cx="340" cy="522" r="10" fill="#c8a25a"/>
<text x="324" y="527" fill="#0b0f12" font-size="11" text-anchor="end" font-weight="700"></text>
<text x="318" y="527" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="end">IO23 · LoRa reset  9</text>
<circle cx="660" cy="522" r="10" fill="#c8a25a"/>
<text x="676" y="527" fill="#0b0f12" font-size="11" text-anchor="start" font-weight="700"></text>
<text x="682" y="527" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="start">9  IO35 · battery</text>
<circle cx="340" cy="566" r="10" fill="#c8a25a"/>
<text x="324" y="571" fill="#0b0f12" font-size="11" text-anchor="end" font-weight="700"></text>
<text x="318" y="571" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="end">IO22 · screen  10</text>
<circle cx="660" cy="566" r="10" fill="#ffd166"/>
<text x="676" y="571" fill="#0b0f12" font-size="11" text-anchor="start" font-weight="700"></text>
<text x="682" y="571" fill="#ffd166" font-size="17" font-weight="700" text-anchor="start">10  IO34</text>
<text x="985" y="554" fill="#ffd166" font-size="14" text-anchor="end">IO34 = bridge RX  ←  toy TX</text>
<line x1="850" y1="566" x2="985" y2="566" stroke="#ffd166" stroke-width="6" stroke-linecap="round"/>

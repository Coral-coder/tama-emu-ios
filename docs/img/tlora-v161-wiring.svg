<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#101418"/>
  <text x="450" y="44" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">LilyGO T-LoRa (T3) V1.6.1 → Tamagotchi link port</text>
  <text x="450" y="72" fill="#9aa4ae" font-size="15" text-anchor="middle">Find the pins by the GPIO numbers printed next to the header holes on the board</text>

  <!-- board -->
  <rect x="60" y="110" width="330" height="440" rx="18" fill="#1d5c3a" stroke="#3fa36b" stroke-width="3"/>
  <text x="225" y="145" fill="#d9f5e4" font-size="18" font-weight="700" text-anchor="middle">T-LoRa V1.6.1</text>
  <rect x="135" y="165" width="180" height="95" rx="6" fill="#0b0f12" stroke="#4b5560"/>
  <text x="225" y="208" fill="#7fd3ff" font-size="14" text-anchor="middle">screen</text>
  <text x="225" y="228" fill="#7fd3ff" font-size="12" text-anchor="middle">(uses 21, 22)</text>
  <rect x="150" y="285" width="150" height="70" rx="6" fill="#2b2f35" stroke="#596370"/>
  <text x="225" y="318" fill="#c9d1d9" font-size="13" text-anchor="middle">LoRa radio</text>
  <text x="225" y="337" fill="#c9d1d9" font-size="12" text-anchor="middle">(uses 5 14 18 19 26 27)</text>
  <rect x="190" y="520" width="70" height="30" rx="5" fill="#9aa4ae"/>
  <text x="225" y="541" fill="#101418" font-size="13" font-weight="700" text-anchor="middle">USB</text>

  <!-- the three pins -->
  <g font-size="20" font-weight="700">
    <circle cx="390" cy="390" r="13" fill="#ffd166"/><text x="350" y="397" fill="#ffd166" text-anchor="end">GPIO 34</text>
    <circle cx="390" cy="440" r="13" fill="#ef476f"/><text x="350" y="447" fill="#ef476f" text-anchor="end">GPIO 13</text>
    <circle cx="390" cy="490" r="13" fill="#cfd8dc"/><text x="350" y="497" fill="#cfd8dc" text-anchor="end">GND</text>
  </g>

  <!-- toy -->
  <rect x="620" y="330" width="230" height="210" rx="105" fill="#ff8fb1" stroke="#ffc2d4" stroke-width="3"/>
  <text x="735" y="372" fill="#3b1020" font-size="18" font-weight="700" text-anchor="middle">Tamagotchi</text>
  <text x="735" y="393" fill="#3b1020" font-size="13" text-anchor="middle">link port pads</text>
  <g font-size="18" font-weight="700">
    <circle cx="640" cy="390" r="11" fill="#ffd166"/><text x="660" y="425" fill="#3b1020">TX</text>
    <circle cx="640" cy="440" r="11" fill="#ef476f"/><text x="660" y="465" fill="#3b1020">RX</text>
    <circle cx="640" cy="490" r="11" fill="#cfd8dc"/><text x="660" y="505" fill="#3b1020">GND</text>
  </g>

  <!-- wires -->
  <g stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M403 390 C 500 390, 540 390, 629 390" stroke="#ffd166"/>
    <path d="M403 440 C 500 440, 540 440, 629 440" stroke="#ef476f"/>
    <path d="M403 490 C 500 490, 540 490, 629 490" stroke="#cfd8dc"/>
  </g>
  <g font-size="14" fill="#c9d1d9" text-anchor="middle">
    <text x="516" y="378">toy TX → board 34</text>
    <text x="516" y="428">board 13 → toy RX</text>
    <text x="516" y="478">ground</text>
  </g>

  <!-- notes -->
  <g font-size="14" fill="#c9d1d9">
    <text x="60" y="590">✕ Do not connect 3V3 or 5V to the toy (it runs on its own batteries).  Line level: 3.3 V, no shifter.</text>
    <text x="60" y="612">Leave alone: 0 2 12 15 (boot), 1 3 (USB), 25 (LED), 35 (battery).  Spare: 4 23 32 33 36 39.</text>
    <text x="60" y="634">Nothing on the screen's byte counters? Swap the 34 and 13 wires.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="860" fill="#101418"/>
<text x="500" y="44" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">LilyGO T-LoRa (T3) V1.6.1 · header pins</text>
<text x="500" y="72" fill="#9aa4ae" font-size="15" text-anchor="middle">From LilyGO's schematic T3_V1.6.1: two 13-pin headers, JP1 (left) and JP2 (right). Pin 1 is the square pad.</text>
<rect x="300" y="100" width="400" height="660" rx="20" fill="#1d5c3a" stroke="#3fa36b" stroke-width="3"/>
<rect x="400" y="130" width="200" height="110" rx="6" fill="#0b0f12" stroke="#4b5560"/><text x="500" y="190" fill="#7fd3ff" font-size="15" text-anchor="middle">screen</text>
<text x="340" y="125" fill="#d9f5e4" font-size="16" font-weight="700" text-anchor="middle">JP1</text>
<text x="660" y="125" fill="#d9f5e4" font-size="16" font-weight="700" text-anchor="middle">JP2</text>
<rect x="465" y="728" width="70" height="32" rx="5" fill="#9aa4ae"/><text x="500" y="750" fill="#101418" font-size="13" font-weight="700" text-anchor="middle">USB</text>
<rect x="330" y="160" width="20" height="20" fill="#c8a25a"/>
<text x="324" y="175" fill="#0b0f12" font-size="11" text-anchor="end" font-weight="700"></text>
<text x="318" y="175" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="end">5V  1</text>
<rect x="650" y="160" width="20" height="20" fill="#c8a25a"/>
<text x="676" y="175" fill="#0b0f12" font-size="11" text-anchor="start" font-weight="700"></text>
<text x="682" y="175" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="start">1  IO25 · LED</text>
<circle cx="340" cy="214" r="10" fill="#cfd8dc"/>
<text x="324" y="219" fill="#0b0f12" font-size="11" text-anchor="end" font-weight="700"></text>
<text x="318" y="219" fill="#cfd8dc" font-size="17" font-weight="700" text-anchor="end">GND  2</text>
<line x1="30" y1="214" x2="150" y2="214" stroke="#cfd8dc" stroke-width="6" stroke-linecap="round"/>
<text x="30" y="202" fill="#cfd8dc" font-size="14">GND  →  toy GND</text>
<circle cx="660" cy="214" r="10" fill="#ef476f"/>
<text x="676" y="219" fill="#0b0f12" font-size="11" text-anchor="start" font-weight="700"></text>

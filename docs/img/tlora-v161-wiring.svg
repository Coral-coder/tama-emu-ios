<text x="324" y="703" fill="#0b0f12" font-size="11" text-anchor="end" font-weight="700"></text>
<text x="318" y="703" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="end">IO21 · screen  13</text>
<circle cx="660" cy="698" r="10" fill="#c8a25a"/>
<text x="676" y="703" fill="#0b0f12" font-size="11" text-anchor="start" font-weight="700"></text>
<text x="682" y="703" fill="#c9d1d9" font-size="15" font-weight="400" text-anchor="start">13  IO36</text>
<g font-size="14" fill="#c9d1d9"><text x="40" y="800">Three wires only: toy TX → IO34, toy RX ← IO4, GND ↔ GND. No 3V3 / 5V to the toy (3.3 V line, no shifter).</text>
<text x="40" y="824">Needs the T-LoRa V1.6.1 firmware (web flasher button or Windows flasher option 2). Nothing on the byte counters? Swap IO34 and IO4.</text>
<text x="40" y="848">Which side is JP1: the header with 5V, GND, 3V3 at its first pins (check the printed labels next to the pads).</text></g></svg>
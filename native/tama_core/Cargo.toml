[package]
name = "tama_core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Native core of the Tama app: the Capybara SNC73410 (Tamagotchi Paradise) emulator with a C ABI"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
stats = []

[dependencies]
# What third_party/capybara/src/emulator needs (and nothing of its desktop GUI)
egui = { version = "0.29", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3

# Builds the Tama Bridge firmware (tool/esp32-bridge) for every ESP32 with Bluetooth LE and
# publishes it on the Releases page, with a Windows flasher (flash.bat + esptool, no install).
name: ESP32 bridge firmware

on:
  push:
    branches: [main]
    paths: ['tool/esp32-bridge/**', '.github/workflows/esp32-bridge.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: esp32
            fqbn: esp32:esp32:esp32:PartitionScheme=huge_app
          - chip: esp32c3
            fqbn: esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=huge_app
          - chip: esp32s3
            fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc,PartitionScheme=huge_app
          - chip: esp32c6
            fqbn: esp32:esp32:esp32c6:CDCOnBoot=cdc,PartitionScheme=huge_app
          - chip: heltec-v3
            fqbn: esp32:esp32:esp32s3:PartitionScheme=huge_app
            flags: -DBOARD_HELTEC_V3
          - chip: heltec-v4
            fqbn: esp32:esp32:esp32s3:PartitionScheme=huge_app
            flags: -DBOARD_HELTEC_V4
          - chip: tlora-v161
            fqbn: esp32:esp32:esp32:PartitionScheme=huge_app
            flags: -DBOARD_TLORA_V161
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          # 3.3.x: the 4.x core replaced the Bluetooth library the firmware is written for
          arduino-cli core install esp32:esp32@3.3.0
          arduino-cli lib install ArduinoJson "ESP8266 and ESP32 OLED driver for SSD1306 displays"
      - name: Build
        run: |
          arduino-cli compile --fqbn '${{ matrix.fqbn }}' --build-property 'compiler.cpp.extra_flags=${{ matrix.flags }}' --export-binaries --output-dir out tool/esp32-bridge
          ls -l out
          cp out/esp32-bridge.ino.merged.bin tama-bridge-${{ matrix.chip }}.bin
      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.chip }}
          path: tama-bridge-${{ matrix.chip }}.bin

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: fw
          merge-multiple: true
      - name: Windows flasher
        run: |
          set -e
          mkdir -p pkg/esptool
          curl -fsSL -o esptool.zip https://github.com/espressif/esptool/releases/download/v4.8.1/esptool-v4.8.1-win64.zip
          unzip -q esptool.zip -d esptool-x
          exe=$(find esptool-x -iname esptool.exe | head -1)
          cp -r "$(dirname "$exe")"/. pkg/esptool/
          cp fw/*.bin pkg/
          cp tool/esp32-bridge/windows/flash.bat tool/esp32-bridge/windows/flash.ps1 pkg/
          cp tool/esp32-bridge/README.md pkg/README.md
          (cd pkg && zip -qr ../Tama-Bridge-Windows-flasher.zip .)
          ls -l pkg fw
      - name: Version
        run: echo "FW=$(sed -nE 's/^#define FW_VERSION "([^"]+)"/\1/p' tool/esp32-bridge/esp32-bridge.ino)" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: esp32-bridge-${{ env.FW }}-${{ github.run_number }}
          name: Tama Bridge ${{ env.FW }} (build ${{ github.run_number }})
          body: |
            Firmware for the Tama Bridge (an ESP32 between a Tamagotchi's link port and the Tama app).

            **Windows:** download `Tama-Bridge-Windows-flasher.zip`, unzip, plug the ESP32 in with USB, double-click `flash.bat`. It finds the board, recognises its chip and writes the right firmware.

            **Other systems:** write the `.bin` for your chip at address 0x0 (esptool, or https://espressif.github.io/esptool-js/).

            Wiring: see README.md (bridge TX to toy RX, bridge RX to toy TX, GND to GND).
          files: |
            Tama-Bridge-Windows-flasher.zip
            fw/*.bin

  # The web flasher on GitHub Pages (ESP Web Tools: Chrome or Edge, USB, nothing to install).
  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: fw
          merge-multiple: true
      - name: Site
        run: |
          set -e
          FW=$(sed -nE 's/^#define FW_VERSION "([^"]+)"/\1/p' tool/esp32-bridge/esp32-bridge.ino)
          mkdir -p site
          cp tool/esp32-bridge/web/index.html site/
          cp fw/*.bin site/
          python3 - "$FW" <<'PY'
          import json, sys
          v = sys.argv[1]
          def m(name, builds):
              return {"name": name, "version": v, "new_install_prompt_erase": True,
                      "builds": [{"chipFamily": c, "parts": [{"path": f, "offset": 0}]} for c, f in builds]}
          json.dump(m("Tama Bridge", [("ESP32", "tama-bridge-esp32.bin"), ("ESP32-C3", "tama-bridge-esp32c3.bin"),
                                      ("ESP32-S3", "tama-bridge-esp32s3.bin"), ("ESP32-C6", "tama-bridge-esp32c6.bin")]),
                    open("site/manifest.json", "w"), indent=1)
          json.dump(m("Tama Bridge (Heltec V3)", [("ESP32-S3", "tama-bridge-heltec-v3.bin")]), open("site/manifest-heltec-v3.json", "w"), indent=1)
          json.dump(m("Tama Bridge (Heltec V4)", [("ESP32-S3", "tama-bridge-heltec-v4.bin")]), open("site/manifest-heltec-v4.json", "w"), indent=1)
          json.dump(m("Tama Bridge (T-LoRa V1.6.1)", [("ESP32", "tama-bridge-tlora-v161.bin")]), open("site/manifest-tlora-v161.json", "w"), indent=1)
          PY
          ls -l site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
